name: Like-wachter
# Blijft zelf wakker: kijkt elke 2 min naar nieuwe likes, ±5u45 lang, en start zichzelf daarna opnieuw.
# De 5-minuten-planning is alleen reserve (als het herstarten een keer mislukt).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Brein toch starten"
        required: false
        default: "false"
      wekker_test:
        description: "Testmelding naar de wekker-app"
        required: false
        default: "false"
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          CLAUDE_FIRE_TOKEN: ${{ secrets.CLAUDE_FIRE_TOKEN }}
          FORCE_FIRST: ${{ inputs.force }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEKKER_TEST_FIRST: ${{ inputs.wekker_test }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "fomo-watcher"
          git config user.email "fomo-watcher@users.noreply.github.com"
          end=$(( $(date +%s) + 345*60 ))
          first=1
          while [ "$(date +%s)" -lt "$end" ]; do
            if [ "$first" = 1 ]; then export FORCE="$FORCE_FIRST" WEKKER_TEST="$WEKKER_TEST_FIRST"; first=0; else export FORCE=false WEKKER_TEST=false; fi
            python3 watch.py || echo "ronde mislukt, volgende keer opnieuw"
            python3 wekker.py || echo "wekker mislukt, volgende keer opnieuw"
            git add state.json wekker.json 2>/dev/null || git add state.json
            if ! git diff --cached --quiet; then
              git commit -qm "state"
              git pull -q --rebase && git push -q || echo "push mislukt"
            fi
            sleep 120
          done
          echo "klaar na ±5u45, start mezelf opnieuw"
          gh workflow run watch.yml --ref main -R "$GITHUB_REPOSITORY"
